spring:
  application:
    name: pdp-assistant
  ai:
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3
      chat:
        options:
          model: qwen3:8b
          temperature: 0.3
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
  datasource:
    url: jdbc:postgresql://localhost:5433/pdp
    username: pdp
    password: pdp
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
logging:
  level:
    org.springframework.ai: DEBUG