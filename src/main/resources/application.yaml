spring:
  application:
    name: pdp-assistant
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:8b
          temperature: 0.3
  datasource:
    url: jdbc:postgresql://localhost:5433/pdp
    username: pdp
    password: pdp
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
logging:
  level:
    org.springframework.ai: DEBUG