services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pdp-postgres
    environment:
      POSTGRES_DB: pdp
      POSTGRES_USER: pdp
      POSTGRES_PASSWORD: pdp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdp"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: